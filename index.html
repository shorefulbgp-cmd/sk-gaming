
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SK FOOTBALL 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07150d;color:white;font-family:Arial}
header{text-align:center;padding:14px;background:#102b1b;color:#4dffad;font-weight:bold}
#score{display:flex;justify-content:space-around;padding:12px;background:#142c20;font-size:20px}
#game{height:65vh;min-height:380px}
canvas{display:block}
#controls{display:flex;justify-content:center;gap:12px;padding:14px}
button{padding:14px 20px;border:0;border-radius:10px;background:#16a765;color:white;font-weight:bold}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<header>⚽ SK FOOTBALL 3D</header>
<div id="score"><span>SK <b id="a">0</b></span><span id="clock">03:00</span><span>AI <b id="b">0</b></span></div>
<div id="game"></div>
<div id="controls">
<button id="left">◀</button>
<button id="forward">▲</button>
<button id="right">▶</button>
<button id="shoot">SHOOT</button>
</div>
<script type="module">
import * as THREE from 'three';
const root=document.querySelector('#game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x82b8dc);
const camera=new THREE.PerspectiveCamera(50,root.clientWidth/root.clientHeight,.1,100);
camera.position.set(0,25,25);
camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(root.clientWidth,root.clientHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x315b38,2));
const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(-8,18,8);scene.add(light);
const green=new THREE.MeshStandardMaterial({color:0x167b3c});
const white=new THREE.MeshStandardMaterial({color:0xffffff});
const field=new THREE.Mesh(new THREE.PlaneGeometry(22,34),green);
field.rotation.x=-Math.PI/2;scene.add(field);
function line(w,d,x,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,.035,d),white);
 o.position.set(x,.03,z);scene.add(o);
}
line(22,.1,0,-17);line(22,.1,0,17);
line(.1,34,-11,0);line(.1,34,11,0);line(22,.1,0,0);
const circle=new THREE.Mesh(new THREE.TorusGeometry(3,.05,8,48),white);
circle.rotation.x=Math.PI/2;circle.position.y=.04;scene.add(circle);
function goal(z){
 const g=new THREE.Group();
 function bar(w,h,d,x,y){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),white);
  m.position.set(x,y,0);g.add(m);
 }
 bar(.15,2.5,.15,-3.5,1.25);bar(.15,2.5,.15,3.5,1.25);bar(7.15,.15,.15,0,2.5);
 g.position.z=z;scene.add(g);
}
goal(-17);goal(17);
function person(color,x,z){
 const group=new THREE.Group();
 const shirt=new THREE.MeshStandardMaterial({color});
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.75,5,12),shirt);
 body.position.y=1.25;group.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.25,16,16),new THREE.MeshStandardMaterial({color:0xe6b68f}));
 head.position.y=2.05;group.add(head);
 for(const side of [-1,1]){
  const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.65,4,8),new THREE.MeshStandardMaterial({color:0x202020}));
  leg.position.set(side*.2,.4,0);group.add(leg);
 }
 group.position.set(x,0,z);scene.add(group);return group;
}
const hero=person(0x10db7a,0,8);
const enemy=person(0xe83a43,1,-8);
const ball=new THREE.Mesh(new THREE.SphereGeometry(.28,24,18),new THREE.MeshStandardMaterial({color:0xffffff}));
ball.position.set(0,.3,0);scene.add(ball);
let score=0,seconds=180,move={left:false,right:false,forward:false};
function bind(id,key){
 const el=document.querySelector('#'+id);
 el.onpointerdown=e=>{e.preventDefault();move[key]=true};
 el.onpointerup=el.onpointercancel=()=>move[key]=false;
}
bind('left','left');bind('right','right');bind('forward','forward');
let velocity=new THREE.Vector3();
document.querySelector('#shoot').onclick=()=>{
 const d=ball.position.distanceTo(hero.position);
 if(d<2.2){velocity.set(hero.position.x*.15,1,-12)}
};
function animate(){
 requestAnimationFrame(animate);
 if(move.left)hero.position.x-=.12;
 if(move.right)hero.position.x+=.12;
 if(move.forward)hero.position.z-=.12;
 hero.position.x=THREE.MathUtils.clamp(hero.position.x,-10,10);
 hero.position.z=THREE.MathUtils.clamp(hero.position.z,-15,15);
 if(hero.position.distanceTo(ball.position)<1.15){
  if(move.left)velocity.x-=.02;
  if(move.right)velocity.x+=.02;
  if(move.forward)velocity.z-=.08;
 }
 velocity.y-=.012;
 ball.position.add(velocity);
 if(ball.position.y<.28){ball.position.y=.28;velocity.y=Math.abs(velocity.y)*.35}
 velocity.multiplyScalar(.99);
 if(Math.abs(ball.position.x)>10)velocity.x*=-.6;
 if(Math.abs(ball.position.z)>17){
  if(Math.abs(ball.position.x)<3.5){
   score++;document.querySelector('#a').textContent=score;
   ball.position.set(0,.3,0);velocity.set(0,0,0);
  }else velocity.z*=-.6;
 }
 enemy.position.x+=Math.sign(ball.position.x-enemy.position.x)*.025;
 enemy.position.z+=Math.sign(ball.position.z-enemy.position.z)*.025;
 camera.position.x+=(hero.position.x*.3-camera.position.x)*.02;
 camera.position.z+=(hero.position.z+17-camera.position.z)*.02;
 camera.lookAt(hero.position.x*.2,0,0);
 renderer.render(scene,camera);
}
setInterval(()=>{
 if(seconds>0){seconds--;document.querySelector('#clock').textContent=
 String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
},1000);
animate();
window.onresize=()=>{
 camera.aspect=root.clientWidth/root.clientHeight;camera.updateProjectionMatrix();
 renderer.setSize(root.clientWidth,root.clientHeight);
};
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SK GAMING</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07120e;color:white;font-family:Arial,sans-serif}
header{background:#102a20;padding:17px;text-align:center;border-bottom:2px solid #19d987}
header h1{margin:0;color:#25e995;letter-spacing:3px}
header p{margin:6px 0 0;color:#c3dfd0;font-size:12px}
nav{display:flex;gap:8px;overflow:auto;padding:12px;background:#0b1d15}
nav button{white-space:nowrap;background:#183d2b;color:white;border:0;padding:10px 14px;border-radius:20px}
.top{display:flex;justify-content:space-between;padding:13px 16px;background:#10251b}
.points{color:#40efa0;font-weight:bold}
main{max-width:1000px;margin:auto;padding:14px}
h2{color:#4aeaa0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{background:#10291e;border:1px solid #225b3e;border-radius:14px;overflow:hidden}
.preview{height:135px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(130deg,#164e34,#071b12)}
.preview:before{content:"";position:absolute;width:180%;height:180%;background:repeating-linear-gradient(45deg,transparent 0 25px,#ffffff0c 26px 28px);animation:move 7s linear infinite}
@keyframes move{to{transform:translateX(50px) translateY(50px)}}
.emoji{position:relative;font-size:62px;filter:drop-shadow(0 8px 8px #0009);animation:float 2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-13px) rotate(5deg)}}
.preview small{position:absolute;bottom:8px;left:9px;background:#0009;padding:5px 8px;border-radius:6px;color:#9effc9}
.cardinfo{padding:12px}
.cardinfo h3{margin:0 0 6px}
.cardinfo p{margin:0 0 10px;color:#a9c7b6;font-size:12px}
.play,.action,.back{border:0;border-radius:8px;padding:11px 14px;background:#18b86e;color:white;font-weight:bold;cursor:pointer}
.play{width:100%}
#gameScreen{display:none}
#arena{height:290px;border-radius:13px;background:radial-gradient(circle,#245b3e,#07160f);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#arena .big{font-size:100px;animation:float 1.5s infinite}
#arena .track{position:absolute;bottom:22px;width:100%;height:5px;background:#a9d8bd55}
.controls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:15px 0}
#status{text-align:center;color:#9cf5c1;min-height:25px}
.back{background:#34483d;margin:12px 0}
footer{text-align:center;color:#819b8b;font-size:12px;padding:20px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.preview{height:155px}}
</style>
</head>
<body>
<header>
<h1>SK GAMING</h1>
<p>3D • VIDEO STYLE • ARCADE ENTERTAINMENT</p>
</header>
<div class="top">
<span>👤 Player</span>
<span class="points">⭐ Points: <span id="points">100</span></span>
</div>
<nav>
<button onclick="filterGames('all')">All Games</button>
<button onclick="filterGames('sports')">Sports</button>
<button onclick="filterGames('racing')">Racing</button>
<button onclick="filterGames('arcade')">Arcade</button>
</nav>
<main>
<section id="home">
<h2>🎮 Game Categories</h2>
<div class="grid" id="gameGrid"></div>
</section>
<section id="gameScreen">
<button class="back" onclick="goHome()">← BACK TO HOME</button>
<h2 id="gameTitle">Game</h2>
<div id="arena"><div class="big" id="gameEmoji">⚽</div><div class="track"></div></div>
<div class="controls" id="controls"></div>
<div id="status">খেলা শুরু করুন!</div>
</section>
</main>
<footer>SK GAMING © 2026 | Virtual points only</footer>
<script>
const games=[
{id:'football',name:'3D Football',emoji:'⚽',cat:'sports',desc:'ফুটবল শট ও গোল চ্যালেঞ্জ'},
{id:'basketball',name:'Basketball',emoji:'🏀',cat:'sports',desc:'বাস্কেট শট চ্যালেঞ্জ'},
{id:'racing',name:'Car Racing',emoji:'🏎️',cat:'racing',desc:'গাড়ি চালান ও স্কোর করুন'},
{id:'bike',name:'Bike Racing',emoji:'🏍️',cat:'racing',desc:'বাইক রেসিং চ্যালেঞ্জ'},
{id:'cricket',name:'Cricket',emoji:'🏏',cat:'sports',desc:'ব্যাটিং শট খেলুন'},
{id:'tennis',name:'Tennis',emoji:'🎾',cat:'sports',desc:'টেনিস র‍্যালি চ্যালেঞ্জ'},
{id:'virtual',name:'Virtual Sports',emoji:'🏆',cat:'sports',desc:'কম্পিউটার সিমুলেশন স্পোর্টস'},
{id:'arcade',name:'Arcade Challenge',emoji:'🎯',cat:'arcade',desc:'দ্রুত ট্যাপ করে পয়েন্ট নিন'}
];
let points=Number(localStorage.getItem('skpoints')||100);
let score=0,gameNow=null,lane=0;
const $=id=>document.getElementById(id);
function updatePoints(n){
 points=Math.max(0,points+n);
 $('points').textContent=points;
 localStorage.setItem('skpoints',points);
}
function render(list){
 $('gameGrid').innerHTML=list.map(g=>`
 <article class="card">
  <div class="preview">
   <div class="emoji">${g.emoji}</div>
   <small>▶ ANIMATED PREVIEW</small>
  </div>
  <div class="cardinfo">
   <h3>${g.name}</h3><p>${g.desc}</p>
   <button class="play" onclick="startGame('${g.id}')">PLAY NOW</button>
  </div>
 </article>`).join('');
}
function filterGames(cat){
 render(cat==='all'?games:games.filter(g=>g.cat===cat));
}
function addButton(label,fn){
 let b=document.createElement('button');
 b.className='action';b.textContent=label;b.onclick=fn;
 $('controls').appendChild(b);
}
function say(t){$('status').textContent=t}
function startGame(id){
 gameNow=games.find(g=>g.id===id);score=0;lane=0;
 $('home').style.display='none';$('gameScreen').style.display='block';
 $('gameTitle').textContent=gameNow.name;
 $('gameEmoji').textContent=gameNow.emoji;
 $('controls').innerHTML='';
 say('খেলা শুরু করুন!');
 if(id==='football'||id==='basketball'||id==='cricket'||id==='tennis'){
  addButton('▶ PLAY',()=>{
   let good=Math.random()>.35;
   if(good){score++;updatePoints(5);say('চমৎকার! +৫ পয়েন্ট | স্কোর: '+score)}
   else say('আবার চেষ্টা করুন!');
  });
  addButton('🔄 RESET',()=>{score=0;say('নতুন খেলা শুরু করুন')});
 }
 if(id==='racing'||id==='bike'){
  addButton('⬅ LEFT',()=>{lane=Math.max(-2,lane-1);$('gameEmoji').style.transform=`translateX(${lane*35}px)`;say('বাম দিকে গেলেন')});
  addButton('RIGHT ➡',()=>{lane=Math.min(2,lane+1);$('gameEmoji').style.transform=`translateX(${lane*35}px)`;say('ডান দিকে গেলেন')});
  addButton('🚀 DRIVE',()=>{score++;updatePoints(2);say('দারুণ রাইড! +২ পয়েন্ট | স্কোর: '+score)});
 }
 if(id==='virtual'){
  addButton('▶ RUN SIMULATION',()=>{
   let result=Math.floor(Math.random()*10)+1;
   score+=result;updatePoints(2);
   say('সিমুলেশন সম্পন্ন! স্কোর '+result+' | মোট '+score);
  });
 }
 if(id==='arcade'){
  addButton('🎯 TAP',()=>{score++;updatePoints(1);say('ট্যাপ সফল! +১ পয়েন্ট | স্কোর: '+score)});
  addButton('RESET',()=>{score=0;say('আবার শুরু করুন')});
 }
}
function goHome(){
 $('gameScreen').style.display='none';$('home').style.display='block';
 $('gameEmoji').style.transform='none';gameNow=null;
}
$('points').textContent=points;
render(games);
</script>
</body>
</html>
